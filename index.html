<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 밥상</title>
  <style>
    :root {
      --bg: #f6ecd9;          /* 한지 느낌 바탕 */
      --ink: #4a2e1f;         /* 먹색에 가까운 갈색 */
      --table: #a0522d;       /* 소반 나무색 */
      --table-dark: #7a3b1d;
      --table-edge: #5e2c14;
      --card: #fffaf0;
      --card-line: #e8d5b5;
      --accent: #b8322a;      /* 단청 붉은색 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 16px;
      background:
        radial-gradient(circle at 20% 10%, #fbf4e6 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, #efdfc4 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    }

    header { text-align: center; }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 0.2em;
      color: var(--ink);
    }

    h1::after {
      content: "";
      display: block;
      width: 60px;
      height: 3px;
      margin: 12px auto 0;
      background: var(--accent);
      border-radius: 2px;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 0.95rem;
      opacity: 0.7;
    }

    /* 둥근 상 */
    .table {
      width: min(90vw, 560px);
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8%;
      background:
        repeating-radial-gradient(circle at 50% 50%,
          rgba(255, 255, 255, 0.04) 0 6px,
          rgba(0, 0, 0, 0.04) 6px 12px),
        radial-gradient(circle at 40% 35%, var(--table) 0%, var(--table-dark) 100%);
      border: 14px solid var(--table-edge);
      box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.35),
        0 24px 40px rgba(94, 44, 20, 0.35);
    }

    /* 반찬 목록 = 카드 */
    .dishes {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .dishes li {
      width: 104px;
      padding: 16px 8px 12px;
      text-align: center;
      background: var(--card);
      border: 2px solid var(--card-line);
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .dishes li:hover { transform: translateY(-4px) rotate(-2deg); }

    .dishes li span {
      display: block;
      font-size: 2.6rem;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    footer {
      font-size: 0.85rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>오늘의 밥상</h1>
    <p class="subtitle">따뜻한 한 끼, 잘 먹겠습니다</p>
  </header>

  <main class="table">
    <!--
      ▼ 반찬 목록 ▼
      한 줄씩 추가하면 상 위에 카드가 늘어나요.
      형식: <li><span>이모지</span>이름</li>
      예시:
        <li><span>🥚</span>계란말이</li>
        <li><span>🐟</span>고등어구이</li>
        <li><span>🥬</span>시금치나물</li>
    -->
    <ul class="dishes">
      <li><span>🍚</span>밥</li>
      <li><span>🍲</span>국</li>
      <li><span>🥬</span>김치</li>
      <li><span>🍖</span>돈가스</li>
      <li><span>🐟</span>꽁치</li>
      <li><span>🥩</span>불고기</li>
    </ul>
  </main>

  <footer>맛있게 드세요 🙏</footer>
</body>
</html>
